[package]
name = "ravenglass"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ravenglass — a character-grid mail client built on Rune."

[[bin]]
name = "ravenglass"
path = "src/main.rs"

[dependencies]
rune = { workspace = true, features = ["tooling"] }   # `tooling`: headless --snap/--tree/--script in release too
mail-core = { path = "../crates/mail-core" }
mail-mock = { path = "../crates/mail-mock" }
mail-store = { path = "../crates/mail-store" }
mail-render = { path = "../crates/mail-render" }
ravenglass-engine = { path = "../crates/ravenglass-engine" }
ravenglass-theme = { path = "../crates/ravenglass-theme" }
ravenglass-brand = { path = "../crates/ravenglass-brand" }
ravenglass-config = { path = "../crates/ravenglass-config" }
mail-auth = { path = "../crates/mail-auth", default-features = false }
serde.workspace = true
toml.workspace = true

# Desktop: direct IMAP/SMTP/JMAP, the OS keyring, HTTPS image fetches and the system browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ravenglass-engine = { path = "../crates/ravenglass-engine", features = ["http"] }
ravenglass-accounts = { path = "../crates/ravenglass-accounts" }
mail-auth = { path = "../crates/mail-auth", features = ["keyring"] }
open = "5"                                             # links leave through the system browser (platform::open_url)

# The web build (architecture §8): mail through the Relay, settings in browser storage.
[target.'cfg(target_arch = "wasm32")'.dependencies]
relay-client = { path = "../crates/relay-client" }
relay-proto = { path = "../crates/relay-proto" }
serde_json.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "Storage", "Location", "Navigator", "StorageManager"] }
# argon2 (mail-auth) reaches getrandom 0.2 through rand_core; in a browser it needs Web Crypto.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
# Installers, built with cargo-packager (packaging/README.md). Paths are relative to this file.
# Build first (`cargo build --release -p ravenglass`), then `cargo packager -p ravenglass --release`.
[package.metadata.packager]
product-name = "Ravenglass"
identifier = "io.github.jasonkolodziej.Ravenglass"   # placeholder until a domain is chosen: packaging/README.md
publisher = "Ravenglass contributors"
copyright = "Copyright © 2026 the Ravenglass contributors"
homepage = "https://github.com/jasonkolodziej/ravenglass"
authors = ["Ravenglass contributors"]
category = "Productivity"
description = "A character-grid mail client"
long-description = "Ravenglass is a fast, keyboard-driven mail client drawn on a monospace character grid."
license-file = "../LICENSE"
out-dir = "../target/packager"
binaries = [{ path = "ravenglass", main = true }]
# The .icns comes from `iconutil` in the macOS release job; elsewhere that glob matches nothing.
icons = ["../packaging/icons/*.icns", "../packaging/icons/hicolor/*/apps/ravenglass.png", "../packaging/icons/ravenglass.ico"]
# No `deep-link-protocols`: on Windows it would overwrite HKLM\Software\Classes\mailto. mailto is
# declared per platform instead (packaging/macos/Info.plist, packaging/linux/ravenglass.desktop,
# packaging/windows/mail-client.wxs).

[package.metadata.packager.macos]
minimum-system-version = "11.0"
info-plist-path = "../packaging/macos/Info.plist"

[package.metadata.packager.deb]
desktop-template = "../packaging/linux/ravenglass.desktop"
section = "mail"
priority = "optional"
# Linked: libc6. Loaded at run time: fontconfig, xkbcommon, Vulkan and a Vulkan driver, and
# the Wayland and X11 client libraries (small, on every desktop).
depends = [
    "libc6", "libfontconfig1", "libxkbcommon0", "libvulkan1", "mesa-vulkan-drivers | vulkan-icd",
    "libwayland-client0", "libxkbcommon-x11-0", "libx11-xcb1", "libxcursor1", "libxi6",
]

[package.metadata.packager.deb.files]
"../LICENSE" = "usr/share/doc/ravenglass/copyright"
"../packaging/icons/hicolor" = "usr/share/icons/hicolor"
"../packaging/linux/io.github.jasonkolodziej.Ravenglass.metainfo.xml" = "usr/share/metainfo/io.github.jasonkolodziej.Ravenglass.metainfo.xml"

[package.metadata.packager.appimage.files]
"../packaging/icons/hicolor" = "usr/share/icons/hicolor"
"../packaging/linux/io.github.jasonkolodziej.Ravenglass.metainfo.xml" = "usr/share/metainfo/io.github.jasonkolodziej.Ravenglass.metainfo.xml"

[package.metadata.packager.wix]
fragment-paths = ["../packaging/windows/mail-client.wxs"]
component-group-refs = ["RavenglassMailClient"]
