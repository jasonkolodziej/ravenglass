name: Rust
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Headless snapshots
        run: |
          cargo run --release -- --snap out/night.png --size 1400x880 --scale 2
          cargo run --release -- --snap out/frost.png --scene frost --size 1400x880 --scale 2
      - uses: actions/upload-artifact@v4
        with: { name: "snapshots-${{ matrix.os }}", path: out/ }

  # Bundle id, publisher, copyright and licence copies agree with packaging/identity.toml.
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: packaging/check-identity.sh

  # The shared crates must keep compiling for the web build (architecture §3, rule 4).
  # This type-checks them; nothing is linked or run in a browser yet.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1", targets: "wasm32-unknown-unknown" }
      - uses: Swatinem/rust-cache@v2
      - run: >
          cargo check --target wasm32-unknown-unknown
          -p mail-core -p relay-proto -p relay-client -p ravenglass-theme -p ravenglass-brand
          -p ravenglass-config -p mail-render -p mail-jmap -p mail-store -p mail-blitz -p ravenglass-engine
      - run: cargo check --target wasm32-unknown-unknown -p mail-auth --no-default-features

  # IMAP and SMTP against a real server (GreenMail, started by tools/greenmail.sh).
  imap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      # The engine tests in this crate link the HTML renderer, which looks fonts up through fontconfig.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.99.1" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mail-imap
        env: { RAVENGLASS_IMAP_TEST: "1" }
