[package]
name = "ravenglass-accounts"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ravenglass account glue: turns an account's settings and stored secrets into a connected MailBackend."

[features]
default = ["http"]
# Blocking HTTPS for OAuth token requests, autoconfig lookups and JMAP on native builds.
http = ["dep:ureq", "mail-jmap/http"]

[dependencies]
mail-core = { path = "../mail-core" }
mail-auth = { path = "../mail-auth" }
mail-imap = { path = "../mail-imap" }
mail-jmap = { path = "../mail-jmap" }
thiserror.workspace = true
ureq = { workspace = true, optional = true }
