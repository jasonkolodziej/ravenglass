[package]
name = "mail-store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ravenglass local cache: SQLite schema, migrations, FolderDelta apply, FTS5 search with operators, journal."

[dependencies]
mail-core = { path = "../mail-core" }
rusqlite = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# On wasm32 rusqlite links SQLite through sqlite-wasm-rs; its `wasm-bindgen` feature supplies
# the clock and randomness SQLite asks its host for.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs.workspace = true

[dev-dependencies]
mail-mock = { path = "../mail-mock" }
