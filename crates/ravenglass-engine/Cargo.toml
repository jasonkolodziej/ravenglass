[package]
name = "ravenglass-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ravenglass engine: the Command/Event boundary over backends, the store, the outbox and rendering. No UI types."

[features]
# `fetch::https_images`: a blocking image fetcher for native builds.
http = ["dep:ureq"]

[dependencies]
ureq = { workspace = true, optional = true }
mail-core = { path = "../mail-core" }
mail-store = { path = "../mail-store" }
mail-render = { path = "../mail-render" }
mail-blitz = { path = "../mail-blitz" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The web host (`web.rs`): the engine as a `spawn_local` task with `setTimeout` timers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
async-channel.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

[dev-dependencies]
mail-mock = { path = "../mail-mock" }
