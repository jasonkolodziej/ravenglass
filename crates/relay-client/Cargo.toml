[package]
name = "relay-client"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MailBackend over the Relay API, for the web build."

[features]
# A blocking HTTP transport for native builds (desktop through a Relay, and tests).
http = ["dep:ureq"]

[dependencies]
ureq = { workspace = true, optional = true }
mail-core = { path = "../mail-core" }
relay-proto = { path = "../relay-proto" }
serde.workspace = true
serde_json.workspace = true

# The browser transport (`web.rs`): fetch, WebSocket and the Relay sign-in.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Headers", "MessageEvent", "Request", "RequestCredentials", "RequestInit", "RequestMode", "Response", "WebSocket"] }

[dev-dependencies]
mail-mock = { path = "../mail-mock" }
ravenglass-relay = { path = "../ravenglass-relay" }
