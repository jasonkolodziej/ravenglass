[package]
name = "mail-auth"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Ravenglass accounts: server settings and autoconfig, OAuth2 with PKCE, and secret storage in the OS keyring."

[features]
default = ["keyring"]
# The OS credential store (Keychain, Credential Manager, Secret Service). Off for wasm builds.
keyring = ["dep:keyring"]

[dependencies]
mail-core = { path = "../mail-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
getrandom.workspace = true
base64.workspace = true
roxmltree.workspace = true
keyring = { workspace = true, optional = true }
