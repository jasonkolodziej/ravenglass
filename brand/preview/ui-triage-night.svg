ote:</text><text x="716.0" y="419.1" fill="#8A85AD" font-weight="400" xml:space="preserve">&gt; Is the pass open yet? I want to send the</text><text x="716.0" y="438.1" fill="#8A85AD" font-weight="400" xml:space="preserve">&gt; Gnomon build north before the snow.</text><rect x="702" y="481" width="658" height="19" fill="#1D1930"/><text x="708.0" y="495.1" fill="#8A85AD" font-weight="400" xml:space="preserve">⠿</text><text x="959.6" y="495.1" fill="#ECEAF6" font-weight="600" xml:space="preserve">reply ▸ Odin Allfather</text><text x="1278.8" y="495.1" fill="#7FD6A6" font-weight="400" xml:space="preserve">draft ✓</text><rect x="716" y="511.4" width="632" height="104.5" fill="none" stroke="#8A85AD" stroke-opacity="0.6"/><text x="724.4" y="533.1" fill="#ECEAF6" font-weight="400" xml:space="preserve">Thanks — sending the build north today. Tell Huginn</text><text x="724.4" y="552.1" fill="#ECEAF6" font-weight="400" xml:space="preserve">to watch the ferry dock.</text><rect x="926.0" y="540.0" width="8.4" height="15" fill="#A9DCFF"/><text x="724.4" y="607.2" fill="#8A85AD" font-weight="400" xml:space="preserve">⇧⌘D send · ⌘⇧A attach · esc normal</text><line x1="1360" y1="36" x2="1360" y2="846" stroke="#1D1930"/><g transform="translate(1370,52) scale(0.8)" fill="none" stroke="#8A85AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19h4l10-10-4-4L5 15z M13 7l4 4"/></g><g transform="translate(1370,88) scale(0.8)" fill="none" stroke="#8A85AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 17a6.5 6.5 0 1 0 0-13 6.5 6.5 0 0 0 0 13z M15.5 15.5 20 20"/></g><g transform="translate(1370,124) scale(0.8)" fill="none" stroke="#8A85AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l3-8h10l3 8v6H4z M4 13h5l1 2h4l1-2h5"/></g><g transform="translate(1370,160) scale(0.8)" fill="none" stroke="#8A85AD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v4H4z M6 9v10