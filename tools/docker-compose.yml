# Local IMAP/SMTP for mail-imap integration tests (plan §5).
# docker compose -f tools/docker-compose.yml up -d
# RAVENGLASS_IMAP_TEST=1 cargo test -p mail-imap
# IMAP 3143 (plain) / 3993 (TLS), SMTP 3025 / 3465. Authentication is on: an account is created
# the first time mail is delivered to an address, with that address as login and password (the
# tests rely on a wrong password being refused). Without Docker, tools/greenmail.sh runs the same
# server from the jar and also sets up the certificate the TLS test needs.
services:
  greenmail:
    image: greenmail/standalone:2.1.15   # the version tools/greenmail.sh runs; not tried under Docker here
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
    ports:
      - "3025:3025"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
