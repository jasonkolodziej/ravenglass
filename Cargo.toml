[workspace]
resolver = "3"
members = [
    "app",
    "crates/mail-core",
    "crates/mail-mock",
    "crates/mail-store",
    "crates/mail-imap",
    "crates/mail-auth",
    "crates/mail-render",
    "crates/mail-blitz",
    "crates/ravenglass-theme",
    "crates/ravenglass-brand",
]
default-members = ["app"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99"

[workspace.dependencies]
# Rune — pin a dev rev; dev is never rewritten. Bump all five lines together.
rune     = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
serde    = { version = "1", features = ["derive"] }
toml     = "0.8"
thiserror = "2"

[patch.crates-io]
# Required: apps that build Rune patch the same crates, from the same rev (see docs/reference/rune-core-README.md, "Depending on Rune").
# Re-check this list against Rune's root Cargo.toml whenever the rev changes.
winit             = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
parley_engine     = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
wgpu-hal          = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }

[profile.perf]
inherits = "release"
debug = 1
