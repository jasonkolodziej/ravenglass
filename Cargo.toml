[workspace]
resolver = "3"
members = [
    "app",
    "crates/mail-core",
    "crates/mail-mock",
    "crates/mail-store",
    "crates/mail-imap",
    "crates/mail-auth",
    "crates/mail-render",
    "crates/mail-blitz",
    "crates/mail-jmap",
    "crates/relay-proto",
    "crates/relay-client",
    "crates/ravenglass-engine",
    "crates/ravenglass-relay",
    "crates/ravenglass-theme",
    "crates/ravenglass-brand",
]
default-members = ["app"]
exclude = ["vendor", "spikes"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.99"

[workspace.dependencies]
# Rune — pin a dev rev; dev is never rewritten. Bump all five lines together.
rune     = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
serde    = { version = "1", features = ["derive"] }
toml     = "0.8"
thiserror = "2"
serde_json = "1"
# Blitz is pre-1.0: exact versions, bumped together. `anyrender` must match the one blitz-paint uses.
blitz-dom = "=0.3.0-beta.4"
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
mail-parser = "1"
mail-builder = "2"
ammonia = "4"
rusqlite = { version = "0.43", features = ["bundled"] }

[patch.crates-io]
# Required: apps that build Rune patch the same crates, from the same rev (see docs/reference/rune-core-README.md, "Depending on Rune").
# Re-check this list against Rune's root Cargo.toml whenever the rev changes.
winit             = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
parley_engine     = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
wgpu-hal          = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "0ca075619d116f8f6e0e3bc8ff815c72c636cac8" }

# Blitz turns on taffy's `flexbox_balance` feature, which adds two `FlexWrap` variants that
# rune-taffy's exhaustive match does not cover (spikes/blitz/REPORT.md). `vendor/rune-taffy` is
# Rune's crate at the pinned rev plus a catch-all arm. Re-copy it on every Rune bump, and drop
# this patch once Rune handles the variants itself.
[patch."https://github.com/anomalyco/rune"]
rune-taffy = { path = "vendor/rune-taffy" }

[profile.perf]
inherits = "release"
debug = 1
