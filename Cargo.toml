[workspace]
resolver = "3"
members = [
    "app",
    "crates/mail-core",
    "crates/mail-mock",
    "crates/mail-store",
    "crates/mail-imap",
    "crates/mail-auth",
    "crates/mail-render",
    "crates/mail-blitz",
    "crates/mail-jmap",
    "crates/relay-proto",
    "crates/relay-client",
    "crates/ravenglass-accounts",
    "crates/ravenglass-config",
    "crates/ravenglass-engine",
    "crates/ravenglass-relay",
    "crates/ravenglass-theme",
    "crates/ravenglass-brand",
    "crates/ravenglass-check",
]
default-members = ["app"]
exclude = ["vendor", "spikes"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
rust-version = "1.99"

[workspace.dependencies]
# Rune — pin a dev rev; dev is never rewritten. Bump every Rune git line (here and in `[patch.crates-io]`) together.
rune     = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
serde    = { version = "1", features = ["derive"] }
toml     = "0.8"
# Rewrites one key of config.toml in place, keeping the user's comments and layout. 0.22 is what toml 0.8 uses.
toml_edit = "0.22"
thiserror = "2"
serde_json = "1"
# Blitz is pre-1.0: exact versions, bumped together. `anyrender` must match the one blitz-paint uses.
blitz-dom = "=0.3.0-beta.4"
blitz-html = "=0.3.0-beta.4"
blitz-paint = "=0.3.0-beta.4"
blitz-traits = "=0.3.0-beta.4"
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
ureq = "3"
keyring = "4"
sha2 = "0.11"
# Password and passcode hashing (Argon2id, pure Rust).
argon2 = { version = "0.5", features = ["std"] }
getrandom = "0.4"
base64 = "0.22"
roxmltree = "0.20"
mail-parser = "1"
mail-builder = { version = "2", default-features = false }
ammonia = "4"
rusqlite = { version = "0.43", features = ["bundled"] }
# mail-imap: IMAP + SMTP over tokio and rustls (ring, webpki roots).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
async-channel = "2"
# The web build (architecture §8, §14): browser APIs from Rust. `wasm-bindgen` must match the
# wasm-bindgen CLI that tools/web-build.sh installs (the exact version in Cargo.lock).
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
# SQLite for wasm32-unknown-unknown (what rusqlite links there); `wasm-bindgen` gives it the
# browser's clock and randomness.
sqlite-wasm-rs = { version = "0.6", default-features = false, features = ["wasm-bindgen"] }
# ravenglass-relay: per-user secrets (AES-256-GCM, HKDF-SHA256), outbound HTTP for OIDC and the image proxy.
aes-gcm = "0.10"
hkdf = "0.13"
subtle = "2"
url = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = "0.29"
# ravenglass-relay: OIDC ID-token signature verification (pure Rust; verification only, no RSA decryption).
rsa = { version = "0.10", default-features = false, features = ["pkcs1v15"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "3", default-features = false, features = ["fast"] }
futures-util = { version = "0.3", default-features = false }
# ravenglass-check: the password prompt without echo.
rpassword = "7"

[patch.crates-io]
# Required: apps that build Rune patch the same crates, from the same rev (see docs/reference/rune-core-README.md, "Depending on Rune").
# Re-check this list against Rune's root Cargo.toml whenever the rev changes. Each crate lives in Rune's
# `vendor/` directory; Cargo finds it in the git repo by name.
wgpu-hal          = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
winit             = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
sctk-adwaita      = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
parley_engine     = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }
accesskit_macos   = { git = "https://github.com/anomalyco/rune", rev = "5e527e71926906f3fd23d0e2781b64742d938f71" }

# Blitz turns on taffy's `flexbox_balance` feature, which adds two `FlexWrap` variants. Rune's
# `rune-taffy` once matched `FlexWrap` exhaustively and we vendored it with a catch-all arm. Since
# this rev, upstream spills unknown variants to `extra` itself, so no patch is needed.

# Argon2 is deliberately slow; unoptimised it takes seconds per hash in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3

[profile.perf]
inherits = "release"
debug = 1
